name: dragon_age_companion
description: Companion app for the Dragon Age RPG (Green Ronin core rulebook).
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  flutter_riverpod: ^2.5.1
  json_annotation: ^4.12.0
  path: ^1.9.0
  path_provider: ^2.1.4
  file_picker: ^13.3.0 # lore export / import (only used in lib/shared/file_dialogs.dart)
  google_fonts: ^6.2.1 # theme fonts (only used in lib/shared/theme.dart)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
  generate: true # builds lib/l10n/app_localizations.dart from the .arb files
  assets:
    - assets/rules/
